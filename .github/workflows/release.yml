name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如: 1.0.4）'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 验证文件
        id: verify
        run: |
          VERSION="${{ github.event.inputs.version }}"
          echo "验证版本 $VERSION 的文件..."
          
          FILES=(
            "OCM-${VERSION}-Setup.exe"
            "OCM-${VERSION}-Portable.exe"
            "OCM-${VERSION}-SHA256.txt"
          )
          
          MISSING=false
          for file in "${FILES[@]}"; do
            if [ -f "$file" ]; then
              SIZE=$(du -h "$file" | cut -f1)
              echo "✅ $file ($SIZE)"
            else
              echo "❌ 缺少文件: $file"
              MISSING=true
            fi
          done
          
          BLOCKMAP=$(find . -name "*${VERSION}*.blockmap" | head -1)
          if [ -n "$BLOCKMAP" ]; then
            echo "✅ 找到 .blockmap 文件"
          else
            echo "⚠️ 未找到 .blockmap 文件（不影响发布）"
          fi
          
          if [ "$MISSING" = true ]; then
            echo "请确保以下文件已上传到仓库根目录："
            echo "  - OCM-${VERSION}-Setup.exe"
            echo "  - OCM-${VERSION}-Portable.exe"
            echo "  - OCM-${VERSION}-SHA256.txt"
            exit 1
          fi

      - name: 检查 Tag 是否已存在
        id: check_tag
        run: |
          TAG="v${{ github.event.inputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "EXISTS=true" >> $GITHUB_OUTPUT
            echo "⚠️ Tag $TAG 已存在"
          else
            echo "EXISTS=false" >> $GITHUB_OUTPUT
          fi

      - name: 创建 Tag
        if: steps.check_tag.outputs.EXISTS == 'false'
        run: |
          TAG="v${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release v${{ github.event.inputs.version }}"
          git push origin "$TAG"
          echo "✅ 已创建并推送 Tag: $TAG"

      - name: 创建 Release
        if: steps.check_tag.outputs.EXISTS == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: OCM v${{ github.event.inputs.version }}
          body: |
            ## 🎵 OCM 音击谱面管理器 v${{ github.event.inputs.version }}

            ### 📦 下载
            - **安装版**: OCM-${{ github.event.inputs.version }}-Setup.exe
            - **便携版**: OCM-${{ github.event.inputs.version }}-Portable.exe

            ### 🔐 SHA256
            请查看 OCM-${{ github.event.inputs.version }}-SHA256.txt

            ---
            *自动发布由 GitHub Actions 生成*
          files: |
            OCM-${{ github.event.inputs.version }}-Setup.exe
            OCM-${{ github.event.inputs.version }}-Portable.exe
            OCM-${{ github.event.inputs.version }}-SHA256.txt
            *${{ github.event.inputs.version }}*.blockmap
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 发布完成
        run: |
          echo "✅ Release v${{ github.event.inputs.version }} 发布成功！"
          echo "🔗 访问: https://github.com/${{ github.repository }}/releases/tag/v${{ github.event.inputs.version }}"
